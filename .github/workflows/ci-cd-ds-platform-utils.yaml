name: Publish DS Platform Utils

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "README.md"
      - "docs/**"

jobs:
  guard-manual-version-bump:
    name: Disallow manual version bumps
    if: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'release-please--branches--') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fail if this PR changes the package version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PACKAGE_NAME: ds-platform-utils
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          package_name = os.environ["PACKAGE_NAME"]


          def git_show(sha: str, path: str) -> str:
              result = subprocess.run(
                  ["git", "show", f"{sha}:{path}"],
                  capture_output=True,
                  text=True,
              )
              return result.stdout if result.returncode == 0 else ""


          def pyproject_version(text: str) -> str | None:
              match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
              return match.group(1) if match else None


          def lock_package_version(text: str, name: str) -> str | None:
              match = re.search(
                  rf'name = "{re.escape(name)}"\nversion = "([^"]+)"',
                  text,
              )
              return match.group(1) if match else None


          errors = []
          base_py = pyproject_version(git_show(base_sha, "pyproject.toml"))
          head_py = pyproject_version(git_show(head_sha, "pyproject.toml"))
          if base_py != head_py:
              errors.append(f"pyproject.toml version {base_py} -> {head_py}")

          base_lock = lock_package_version(git_show(base_sha, "uv.lock"), package_name)
          head_lock = lock_package_version(git_show(head_sha, "uv.lock"), package_name)
          if base_lock != head_lock:
              errors.append(f"uv.lock {package_name} version {base_lock} -> {head_lock}")

          if errors:
              print(
                  "::error::Do not bump the package version in feature PRs. "
                  "Release Please updates pyproject.toml and uv.lock in a dedicated release PR."
              )
              print("\n".join(errors))
              sys.exit(1)
          PY

  code-quality-checks:
    name: Lint, Format, and Static Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ github.workspace }}/uv.lock"

      - name: Run pre-commit hooks
        run: SKIP=no-commit-to-branch uv run poe lint # using poethepoet needs to be setup before using poe lint

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ github.workspace }}/uv.lock"

      - name: Build Wheel
        run: uv build --wheel

      - name: Upload Wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-dist
          path: ./dist/

  execute-tests:
    needs:
      - build-wheel
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ github.workspace }}/uv.lock"

      - name: Download Wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-dist
          path: ./dist/

      - name: Configure Outerbounds Auth
        run: |-
          uvx outerbounds service-principal-configure \
            --name ds-platform-utils \
            --deployment-domain pattern.obp.outerbounds.com \
            --perimeter default \
            --github-actions

      # Temporarily disabling pytest-coverage in CI to avoid --
      # coverage.exceptions.DataError: Can't combine branch coverage data with statement data
      - name: Install Wheel & Run Tests against Wheel
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install ./dist/*whl
          uv pip install --group dev
          COVERAGE_DIR="$(python -c 'import ds_platform_utils; print(ds_platform_utils.__path__[0])')"
          poe clean
          poe test --cov="$COVERAGE_DIR" --no-cov -n auto
