# Kueue ResourceFlavors + priority classes.
#
# A ResourceFlavor is Kueue's name for "a kind of capacity". It carries the
# nodeLabels/tolerations Kueue stamps onto an admitted Workload, which is how
# a quota decision turns into a scheduling decision — the labels steer the pod
# at the matching Karpenter NodePool.
#
# Flavors mirror the NodePools one-for-one (see karpenter-nodepools.yaml) so a
# team's quota can be expressed per architecture and per GPU class.

---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: x86-ondemand
spec:
  nodeLabels:
    pattern-ml-platform.pattern.com/pool: x86-ondemand
    kubernetes.io/arch: amd64

---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: arm64-ondemand
spec:
  nodeLabels:
    pattern-ml-platform.pattern.com/pool: arm64-ondemand
    kubernetes.io/arch: arm64

---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu
spec:
  nodeLabels:
    pattern-ml-platform.pattern.com/pool: gpu
  # THE GATE. Kueue will only assign this flavor to a Workload whose pod spec
  # already tolerates these taints, so a CPU-only step can never be placed
  # here.
  #
  # Without it, flavors are simply tried in order and a team with GPU
  # entitlement fell through to this one whenever its x86 and arm64 quota was
  # exhausted: a pod asking for zero GPUs trivially fits `nvidia.com/gpu: 8`,
  # so `content` running 256 cores of CPU work would put the next plain step
  # on a g6e node -- or, with the arm64 default, leave it Pending forever,
  # since this flavor's nodeLabels pin the amd64-only GPU pool against a pod
  # whose nodeSelector says arm64. A zero GPU quota only closes that door for
  # teams that have no GPU quota at all.
  #
  # Mirrors the taint the GPU NodePool applies (karpenter-nodepools.yaml).
  nodeTaints:
    - key: nvidia.com/gpu
      value: "true"
      effect: NoSchedule
  # Applied by Kueue to admitted pods so they clear that same taint on the
  # node. The runner adds it itself for a GPU step, which is what makes the
  # gate above pass.
  tolerations:
    - key: nvidia.com/gpu
      value: "true"
      operator: Equal
      effect: NoSchedule

---
# Priority classes let an urgent backfill preempt a routine nightly run
# inside the same ClusterQueue. Higher value wins.
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: low
value: 100
description: "Backfills, experiments — first to be preempted."

---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: normal
value: 1000
description: "Default for scheduled production flows."

---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: high
value: 10000
description: "Time-sensitive reruns and incident response."
