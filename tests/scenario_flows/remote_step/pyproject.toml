[project]
name = "eksflow"
version = "0.1.0"
description = "Scenario flows exercising @remote_step end to end"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ds-platform-utils",
    "outerbounds~=0.12.42",
    # Below pandas 3 on purpose: 3.0.x has no macOS arm64 wheel yet, and
    # fast-bakery builds the *driver* env locally, so @uv_pypi flows could not
    # run on a laptop at all. The runner is linux and would be fine either way.
    "pandas>=2.2,<3",
    "pydantic>=2",
]

[tool.uv.sources]
ds-platform-utils = { git = "https://github.com/patterninc/ds-platform-utils.git", rev = "b3b2c632aa5e5151b0d7ce0363325cd92afdfc94" }

[dependency-groups]
# Exercised by fx20: a group must only appear when the step names it.
extra = ["orjson>=3.10"]
